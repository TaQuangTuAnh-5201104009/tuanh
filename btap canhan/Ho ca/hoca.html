<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Cá Ban Đêm</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1230;
        }
        h2 {
            text-align: center;
            color: #ffe9a8;
            margin: 20px 10px;
        }

        #hoca {
            position: relative;
            height: 480px;
            margin: 0 20px 30px;
            background: linear-gradient(to bottom, #1d3a7a, #0a1a45, #050b24);
            border: 4px solid #ffe9a8;
            border-radius: 16px;
            overflow: hidden;
        }

        #trang {
            position: absolute;
            top: 20px;
            right: 60px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #fff3c4;
            box-shadow: 0 0 30px 10px rgba(255, 243, 196, 0.5);
        }

        .sao {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: white;
            animation: nhap 2s ease-in-out infinite alternate;
        }
        @keyframes nhap {
            from { opacity: 0.2; }
            to   { opacity: 1; }
        }
        #s1 { left: 10%; top: 30px; }
        #s2 { left: 25%; top: 80px; animation-delay: -1s; }
        #s3 { left: 40%; top: 20px; animation-delay: -0.5s; }
        #s4 { left: 60%; top: 70px; }
        #s5 { left: 75%; top: 35px; animation-delay: -1.5s; }

        #cat {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #8a7550;
            border-top: 4px solid #6b5a3c;
        }

        #hoca img {
            position: absolute;
            height: auto;
        }
        .ca {
            left: -25%;
            animation: boi 20s linear infinite;
        }
        @keyframes boi {
            from { left: -25%; }
            to   { left: 100%; }
        }
        #camap  { width: 200px; top: 110px; animation-duration: 18s; }
        #cavang { width: 160px; top: 200px; animation-duration: 24s; animation-delay: -8s; }
        #camo   { width: 160px; top: 270px; animation-duration: 30s; animation-delay: -15s; }
        #rua    { width: 130px; top: 330px; animation-duration: 40s; animation-delay: -25s; }

        .tholan {
            width: 90px;
            animation: troi 5s ease-in-out infinite alternate;
        }
        @keyframes troi {
            from { top: 160px; }
            to   { top: 240px; }
        }
        #tholan1 { left: 12%; }
        #tholan2 { left: 48%; animation-delay: -2s; }
        #tholan3 { left: 82%; animation-delay: -4s; }

        .bong {
            position: absolute;
            bottom: 40px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: rgba(173, 232, 255, 0.35);
            border: 2px solid #bdeeff;
            animation: noi 6s linear infinite;
        }
        @keyframes noi {
            from { bottom: 40px;  opacity: 1; }
            to   { bottom: 480px; opacity: 0; }
        }
        #b1 { left: 8%; }
        #b2 { left: 22%; animation-delay: 2s; width: 24px; height: 24px; }
        #b3 { left: 38%; animation-delay: 4s; width: 12px; height: 12px; }
        #b4 { left: 55%; animation-delay: 1s; }
        #b5 { left: 70%; animation-delay: 3s; width: 28px; height: 28px; }
        #b6 { left: 90%; animation-delay: 5s; width: 14px; height: 14px; }

        .rong {
            position: absolute;
            bottom: 40px;
            width: 18px;
            background-color: #2fa88a;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom;
            animation: lac 3s ease-in-out infinite alternate;
        }
        @keyframes lac {
            from { rotate: -8deg; }
            to   { rotate: 8deg; }
        }
        #r1 { left: 5%;  height: 120px; }
        #r2 { left: 8%;  height: 90px;  animation-delay: -1s; }
        #r3 { left: 47%; height: 140px; animation-delay: -2s; }
        #r4 { left: 88%; height: 100px; }
        #r5 { left: 91%; height: 130px; animation-delay: -1s; }
    </style>
</head>
<body>
    <h2>Trần Phương Nhật Phi - 52.01.104.077</h2>

    <div id="hoca">
        <!-- Trăng và sao -->
        <div id="trang"></div>
        <div class="sao" id="s1"></div>
        <div class="sao" id="s2"></div>
        <div class="sao" id="s3"></div>
        <div class="sao" id="s4"></div>
        <div class="sao" id="s5"></div>

        <!-- Cá -->
        <img class="ca" id="camap"  src="shark.png"          alt="Cá mập">
        <img class="ca" id="cavang" src="goldFishSchool.png" alt="Đàn cá vàng">
        <img class="ca" id="camo"   src="faintSchool.png"    alt="Đàn cá mờ">
        <img class="ca" id="rua"    src="turtle.png"         alt="Rùa">

        <!-- Thợ lặn -->
        <img class="tholan" id="tholan1" src="diver1.png" alt="Thợ lặn 1">
        <img class="tholan" id="tholan2" src="diver2.png" alt="Thợ lặn 2">
        <img class="tholan" id="tholan3" src="diver3.png" alt="Thợ lặn 3">

        <!-- Bong bóng -->
        <div class="bong" id="b1"></div>
        <div class="bong" id="b2"></div>
        <div class="bong" id="b3"></div>
        <div class="bong" id="b4"></div>
        <div class="bong" id="b5"></div>
        <div class="bong" id="b6"></div>

        <!-- Rong biển và cát -->
        <div class="rong" id="r1"></div>
        <div class="rong" id="r2"></div>
        <div class="rong" id="r3"></div>
        <div class="rong" id="r4"></div>
        <div class="rong" id="r5"></div>
        <div id="cat"></div>
    </div>
</body>
</html>
